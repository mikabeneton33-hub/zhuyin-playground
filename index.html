<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ㄅㄆㄇ 注音樂園</title>
<meta name="description" content="給小朋友的注音符號學習網站：37 個注音、拼音練習、聽音辨認、配對遊戲。免安裝、免登入。">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="注音樂園">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">ㄅ</div>
      <h1>注音樂園<small>ZHUYIN PLAYGROUND</small></h1>
    </div>
    <div class="row" style="gap:8px">
      <button class="stars" id="starsbtn" aria-label="我的星星與進度"><span class="ic">⭐</span><span id="stars">0</span></button>
      <button class="iconbtn" id="mute" aria-label="音效開關">🔊</button>
    </div>
  </header>

  <main>
    <section id="v-learn" class="view" aria-labelledby="learn"></section>
    <section id="v-book" class="view"></section>
    <section id="v-spell" class="view"></section>
    <section id="v-quiz" class="view"></section>
    <section id="v-match" class="view"></section>
    <section id="v-animals" class="view"></section>
    <section id="v-progress" class="view"></section>
  </main>
</div>

<nav class="tabbar" aria-label="主選單">
  <button class="tab" data-v="learn"><span class="ic">🔤</span>注音表</button>
  <button class="tab" data-v="book"><span class="ic">📘</span>課本</button>
  <button class="tab" data-v="spell"><span class="ic">🧩</span>拼拼看</button>
  <button class="tab" data-v="quiz"><span class="ic">👂</span>聽聽看</button>
  <button class="tab" data-v="match"><span class="ic">🃏</span>翻翻樂</button>
  <button class="tab" data-v="animals"><span class="ic">🦁</span>動物</button>
</nav>

<div id="backdrop" class="backdrop"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="符號說明"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
