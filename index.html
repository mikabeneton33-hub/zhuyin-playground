<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>小一學習樂園</title>
<meta name="description" content="給國小一年級的學習網站：國語注音、數學。闖關、遊戲、每日任務，免安裝、免登入、可離線。">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="學習樂園">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">ㄅ</div>
      <h1>學習樂園<small>PLAYGROUND</small></h1>
    </div>
    <div class="row topright">
      <div class="seg" id="voicetoggle" role="group" aria-label="發音來源">
        <button data-mode="human" title="教育部辭典真人錄音">真人</button>
        <button data-mode="tts" title="裝置內建合成語音">合成</button>
      </div>
      <button class="stars" id="starsbtn" aria-label="我的星星與進度"><span class="ic">⭐</span><span id="stars">0</span></button>
      <button class="iconbtn" id="mute" aria-label="音效開關">🔊</button>
    </div>
  </header>
  <nav class="subjects" id="subjectseg" aria-label="科目"></nav>

  <main>
    <div id="backbar" class="backbar" hidden><button class="pill">← 遊戲樂園</button></div>
  </main>
</div>

<nav class="tabbar" aria-label="主選單"></nav>

<div id="backdrop" class="backdrop"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="符號說明"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
