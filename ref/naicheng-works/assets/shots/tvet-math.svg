<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">統測數學練功房</title>
  <desc id="desc">琥珀棕色數學公式背景與題庫功能摘要</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a0f"/>
      <stop offset=".5" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#92551b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#f8f0e6" stop-opacity=".94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1d1006" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="85" cy="50" r="220" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1180" cy="760" r="260" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <g fill="#f3e0c4" fill-opacity=".18" font-family="Georgia, serif" font-style="italic">
    <text x="70" y="185" font-size="104">∫</text>
    <text x="220" y="100" font-size="44">x² + y² = r²</text>
    <text x="885" y="115" font-size="54">Σ aₙ</text>
    <text x="990" y="245" font-size="46">log₂x</text>
    <text x="135" y="675" font-size="48">tanθ = sinθ / cosθ</text>
    <text x="925" y="715" font-size="48">C(n,r)</text>
  </g>
  <g transform="translate(98 92)">
    <text x="0" y="0" fill="#f0d9b5" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="25" font-weight="700" letter-spacing="7">四技二專統測・歷屆試題</text>
    <text x="0" y="78" fill="#fdf6ea" font-family="'Noto Serif TC','Songti TC',serif" font-size="68" font-weight="700" letter-spacing="9">統測數學練功房</text>
    <text x="3" y="127" fill="#f3e0c4" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="26">90～115 學年度・工業／商業／護理等各類群</text>
  </g>
  <g transform="translate(98 300)" filter="url(#shadow)">
    <rect width="1084" height="350" rx="30" fill="url(#card)"/>
    <g transform="translate(55 55)" font-family="'Noto Sans TC','PingFang TC',sans-serif">
      <text fill="#8a4f14" font-size="25" font-weight="700" letter-spacing="3">互動練習</text>
      <text y="51" fill="#3a2513" font-size="31" font-weight="700">依學年度・卷別・單元・難度自由篩選</text>
      <g transform="translate(0 105)">
        <rect width="298" height="96" rx="16" fill="#f3e5cf"/>
        <text x="26" y="39" fill="#8a4f14" font-size="22" font-weight="700">90 份正式試卷</text>
        <text x="26" y="72" fill="#6b5d4d" font-size="19">共 2,250 題</text>
      </g>
      <g transform="translate(327 105)">
        <rect width="298" height="96" rx="16" fill="#f0ece2"/>
        <text x="26" y="39" fill="#6b5330" font-size="22" font-weight="700">LaTeX 公式詳解</text>
        <text x="26" y="72" fill="#6b5d4d" font-size="19">題目與選項可選取</text>
      </g>
      <g transform="translate(654 105)">
        <rect width="320" height="96" rx="16" fill="#f4ecdf"/>
        <text x="26" y="39" fill="#7a5a1f" font-size="22" font-weight="700">原卷裁圖比對</text>
        <text x="26" y="72" fill="#6b5d4d" font-size="19">答案逐題比對官方答案卡</text>
      </g>
      <text x="0" y="270" fill="#6b5d4d" font-size="20">免登入・錯題與學習歷程只保存在自己的瀏覽器</text>
    </g>
  </g>
</svg>
