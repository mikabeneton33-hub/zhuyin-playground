<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">學測數學考古題</title>
  <desc id="desc">深綠色數學公式背景與題庫功能摘要</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10262b"/>
      <stop offset=".5" stop-color="#174b4c"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#eef6f5" stop-opacity=".94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071b1d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="85" cy="50" r="220" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1180" cy="760" r="260" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <g fill="#d7efeb" fill-opacity=".16" font-family="Georgia, serif" font-style="italic">
    <text x="70" y="185" font-size="104">∫</text>
    <text x="220" y="100" font-size="44">a² + b² = c²</text>
    <text x="885" y="115" font-size="54">Σ xᵢ</text>
    <text x="990" y="245" font-size="46">f′(x)</text>
    <text x="135" y="675" font-size="48">sin²θ + cos²θ = 1</text>
    <text x="925" y="715" font-size="48">det(A)</text>
  </g>
  <g transform="translate(98 92)">
    <text x="0" y="0" fill="#9fd8d0" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="25" font-weight="700" letter-spacing="7">大學學測・歷屆試題</text>
    <text x="0" y="78" fill="#f5fbfa" font-family="'Noto Serif TC','Songti TC',serif" font-size="68" font-weight="700" letter-spacing="9">學測數學考古題</text>
    <text x="3" y="127" fill="#d7efeb" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="26">83～115 學年度・數學 A／數學 B／舊制數學</text>
  </g>
  <g transform="translate(98 300)" filter="url(#shadow)">
    <rect width="1084" height="350" rx="30" fill="url(#card)"/>
    <g transform="translate(55 55)" font-family="'Noto Sans TC','PingFang TC',sans-serif">
      <text fill="#174b4c" font-size="25" font-weight="700" letter-spacing="3">互動練習</text>
      <text y="51" fill="#22283a" font-size="31" font-weight="700">依年份・單元・題型・難度自由篩選</text>
      <g transform="translate(0 105)">
        <rect width="298" height="96" rx="16" fill="#e2f2ef"/>
        <text x="26" y="39" fill="#246b68" font-size="22" font-weight="700">38 份正式試卷</text>
        <text x="26" y="72" fill="#5f6b7d" font-size="19">共 760 題</text>
      </g>
      <g transform="translate(327 105)">
        <rect width="298" height="96" rx="16" fill="#e8eef4"/>
        <text x="26" y="39" fill="#365d6f" font-size="22" font-weight="700">LaTeX 公式詳解</text>
        <text x="26" y="72" fill="#5f6b7d" font-size="19">題目與選項可選取</text>
      </g>
      <g transform="translate(654 105)">
        <rect width="320" height="96" rx="16" fill="#edf4e8"/>
        <text x="26" y="39" fill="#28735a" font-size="22" font-weight="700">官方統計資料</text>
        <text x="26" y="72" fill="#5f6b7d" font-size="19">答對率・鑑別度・選項率</text>
      </g>
      <text x="0" y="270" fill="#5f6b7d" font-size="20">免登入・錯題與學習歷程只保存在自己的瀏覽器</text>
    </g>
  </g>
</svg>
